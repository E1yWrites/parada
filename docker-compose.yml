services:
  postgres:
    image: postgres:16-alpine
    container_name: parada-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-parada}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-changeme}
      POSTGRES_DB: ${POSTGRES_DB:-parada}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - parada_pgdata:/var/lib/postgresql/data

volumes:
  parada_pgdata:
